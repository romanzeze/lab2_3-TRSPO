# Профіль для збереження даних у MySQL: ./gradlew bootRun --args='--spring.profiles.active=mysql'
# Пароль не зберігається в репозиторії: задайте його змінною середовища DB_PASSWORD.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME:hospital}?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.h2.console.enabled=false
