spring.application.name=hospital
server.port=8080

# Дані зберігаються в пам'яті на час роботи сервісу (база даних не потрібна).
spring.datasource.url=jdbc:h2:mem:hospital;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Консоль H2 для перегляду даних: http://localhost:8080/h2-console (JDBC URL вказаний вище)
spring.h2.console.enabled=true
